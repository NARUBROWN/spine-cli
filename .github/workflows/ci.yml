name: CLI CI
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      channel:
        type: string
        required: false
      reuse_common:
        type: boolean
        default: false
    outputs:
      verified_sha:
        value: ${{ jobs.verified.outputs.sha }}
  pull_request:
    branches: [preview, rc, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [preview, rc, main]
  schedule:
    - cron: '23 18 * * *'
permissions:
  contents: read
env:
  GOWORK: 'off'
jobs:
  source:
    name: Check for previously verified source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      reuse_common: ${{ inputs.reuse_common || steps.promotion.outputs.candidate != '' }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.ref && (github.base_ref == 'rc' || github.base_ref == 'main' || github.ref_name == 'rc' || github.ref_name == 'main') }}
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: ${{ !inputs.ref && (github.base_ref == 'rc' || github.base_ref == 'main' || github.ref_name == 'rc' || github.ref_name == 'main') }}
        with:
          go-version: '1.26.0'
          cache: false
      - name: Verify the previous candidate
        if: ${{ !inputs.ref && (github.base_ref == 'rc' || github.base_ref == 'main' || github.ref_name == 'rc' || github.ref_name == 'main') }}
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./scripts/release/publication check-promotion-ci
  policy:
    needs: source
    if: needs.source.outputs.reuse_common != 'true'
    name: Release Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: node scripts/release/branch_flow.cjs
      - run: node --test scripts/release/branch_flow.test.cjs
      - run: go run ./scripts/release/publication validate-policy
      - run: go test -race ./scripts/release/... ./.github/actions/discord-tag
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint -shellcheck= -pyflakes=
  portable:
    needs: source
    if: needs.source.outputs.reuse_common != 'true'
    name: Portable CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: go build ./...
      - run: go test ./internal/cli -run '^(TestControllerInputNameConformance|TestRunVersionUsesProgramName|TestBuildVersion|Test.*Protocol.*|Test.*Schema.*|TestCapabilities.*|Test.*Windows.*|TestApplicationShutdownTimeout|TestStructured.*|TestHTTPBindings.*|TestRuntimeOpenAPI.*|TestRuntimeExportOptions.*|TestReleaseRecipe.*|TestResolvePreviewModulesUsesGoProxyAndCanonicalVersions|TestDynamicPlatform.*|TestPreviewBranchMovement.*|TestPreviewResolutionFailure.*)$' -count=1 -timeout=5m
      - if: runner.os != 'Windows'
        run: go test ./internal/cli -run '^(TestRunAndDevGracefulShutdown|TestGeneratedHTTPShutdownDrainsRequests|TestDevRuntimeLifecycleEndToEnd)$' -count=1 -timeout=5m
  public-platforms:
    needs: source
    if: needs.source.outputs.reuse_common != 'true'
    name: Public Platforms and Full Regression
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 35
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Prepare minimum Go toolchain
        run: |
          minimum_go_root=$(GOTOOLCHAIN=go1.25.5 go env GOROOT)
          echo "SPINE_TEST_GO125=$minimum_go_root/bin/go" >> "$GITHUB_ENV"
      - name: Start Redpanda
        run: |
          docker run -d --name cli-kafka -p 127.0.0.1:19092:9092 redpandadata/redpanda:v24.3.18 redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr 127.0.0.1:19092
          for attempt in $(seq 1 60); do
            if docker exec cli-kafka rpk cluster info -X brokers=127.0.0.1:9092 >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs cli-kafka
          exit 1
      - run: go vet ./...
      - name: Start NATS JetStream
        run: |
          docker run -d --name cli-nats -p 127.0.0.1:4222:4222 nats:2.12.1-alpine -js
          for attempt in $(seq 1 30); do
            if docker logs cli-nats 2>&1 | grep -q 'Server is ready'; then exit 0; fi
            sleep 1
          done
          docker logs cli-nats
          exit 1
      - name: CLI race and generated public applications
        id: regression
        env:
          SPINE_TEST_KAFKA_BROKER: 127.0.0.1:19092
          SPINE_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
          SPINE_TEST_NATS_URL: nats://127.0.0.1:4222
        run: go test -race -json ./... -count=1 -timeout=30m > regression.jsonl
      - name: Require live broker and minimum Go evidence
        run: go run ./scripts/release/regression check regression.jsonl
      - name: Check reproducibility
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l .)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-regression
          path: regression.jsonl
      - name: Report extended regression
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          echo "Extended public adapter regression: $REGRESSION_OUTCOME. Optional, see job log and artifact for details." >> "$GITHUB_STEP_SUMMARY"
  core-regression:
    needs: source
    if: needs.source.outputs.reuse_common != 'true'
    name: Required Core Regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: go run ./scripts/release/regression core
      - run: go run ./scripts/release/regression check core-regression.jsonl --core
      - name: Check reproducibility
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l .)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-regression
          path: core-regression.jsonl
  live-composition:
    name: Required channel composition (${{ matrix.layout }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        layout: [legacy, layered-v1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Generate and verify the target channel composition
        env:
          TARGET_CHANNEL: ${{ inputs.channel || github.base_ref || github.ref_name }}
          SPINE_COMPOSITION_CASE: echo
          SPINE_COMPOSITION_LAYOUT: ${{ matrix.layout }}
        run: |
          case "$TARGET_CHANNEL" in
            preview|rc|stable) export SPINE_COMPOSITION_CHANNEL="$TARGET_CHANNEL" ;;
            main) export SPINE_COMPOSITION_CHANNEL=stable ;;
            *) echo "Unknown target channel: $TARGET_CHANNEL" >&2; exit 1 ;;
          esac
          go test ./internal/cli -run '^TestChannelComposition$' -v -count=1 -timeout=20m
  optional-composition:
    name: Optional channel composition (${{ matrix.layout }}, ${{ matrix.case }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        layout: [legacy, layered-v1]
        case: [nethttp, websocket, validator, kafka, rabbitmq, nats, worker-kafka, worker-rabbitmq, worker-nats]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Check optional adapter
        id: check
        env:
          TARGET_CHANNEL: ${{ inputs.channel || github.base_ref || github.ref_name }}
          SPINE_COMPOSITION_CASE: ${{ matrix.case }}
          SPINE_COMPOSITION_LAYOUT: ${{ matrix.layout }}
        run: |
          case "$TARGET_CHANNEL" in
            preview|rc|stable) export SPINE_COMPOSITION_CHANNEL="$TARGET_CHANNEL" ;;
            main) export SPINE_COMPOSITION_CHANNEL=stable ;;
            *) echo "Unknown target channel: $TARGET_CHANNEL" >&2; exit 1 ;;
          esac
          go test ./internal/cli -run '^TestChannelComposition$' -v -count=1 -timeout=20m 2>&1 | tee "$RUNNER_TEMP/composition.log"
      - name: Report optional result
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CHECK_LAYOUT: ${{ matrix.layout }}
          CHECK_CASE: ${{ matrix.case }}
        run: |
          if [ -f "$RUNNER_TEMP/composition.log" ] && grep -q '^--- SKIP: TestChannelComposition' "$RUNNER_TEMP/composition.log"; then CHECK_OUTCOME=unavailable; fi
          echo "Optional $CHECK_LAYOUT $CHECK_CASE: $CHECK_OUTCOME, see check log for details" >> "$GITHUB_STEP_SUMMARY"
  verified:
    name: ${{ github.event_name == 'pull_request' && format('Verified Source / {0}', github.base_ref) || 'Verified Source' }}
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [source, policy, portable, core-regression, public-platforms, live-composition, optional-composition]
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - id: source
        env:
          RESULTS: ${{ toJSON(needs) }}
          REUSE_COMMON: ${{ needs.source.outputs.reuse_common }}
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: go run ./scripts/release/publication verified-source
