name: CLI CI
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      channel:
        type: string
        required: false
      reuse_common:
        type: boolean
        default: false
    outputs:
      verified_sha:
        value: ${{ jobs.verified.outputs.sha }}
  pull_request:
    branches: [preview, rc, main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [preview, rc, main]
permissions:
  contents: read
env:
  GOWORK: 'off'
jobs:
  source:
    name: Check for previously verified source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      reuse_common: ${{ inputs.reuse_common || steps.promotion.outputs.candidate != '' }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.ref && (github.base_ref == 'rc' || github.base_ref == 'main' || github.ref_name == 'rc' || github.ref_name == 'main') }}
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: ${{ !inputs.ref && (github.base_ref == 'rc' || github.base_ref == 'main' || github.ref_name == 'rc' || github.ref_name == 'main') }}
        with:
          go-version: '1.26.0'
          cache: false
      - name: Verify the previous candidate
        if: ${{ !inputs.ref && (github.base_ref == 'rc' || github.base_ref == 'main' || github.ref_name == 'rc' || github.ref_name == 'main') }}
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./scripts/release/publication check-promotion-ci
  policy:
    needs: source
    if: needs.source.outputs.reuse_common != 'true'
    name: Release Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: node scripts/release/branch_flow.cjs
      - run: node --test scripts/release/branch_flow.test.cjs
      - run: go run ./scripts/release/publication validate-policy
      - run: go test -race ./scripts/release/... ./.github/actions/discord-tag
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint -shellcheck= -pyflakes=
  portable:
    needs: source
    if: needs.source.outputs.reuse_common != 'true'
    name: Portable CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: go build ./...
      - run: go test ./internal/cli -run '^(TestRunVersionUsesProgramName|TestBuildVersion|TestDevBinaryPathUsesExecutableExtensionOnlyOnWindows|TestDevTerminationUsesImmediateKillOnlyOnWindows|TestWindowsFallbackReportsForcedTermination|TestGlobalRootRunsCommandWithoutChangingCallerDirectory|TestInvalidImportPathsFailBeforeGenerationWrites)$' -count=1 -timeout=5m
      - if: runner.os != 'Windows'
        run: go test ./internal/cli -run '^TestProcessGroupInterruptAndDevRestart$' -count=1 -timeout=5m
  core-regression:
    needs: source
    if: needs.source.outputs.reuse_common != 'true'
    name: Required Core Regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: go vet ./...
      - run: go run ./scripts/release/regression core
      - run: go run ./scripts/release/regression check core-regression.jsonl --core
      - name: Check reproducibility
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(gofmt -l .)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-regression
          path: core-regression.jsonl
  generated-regression:
    needs: source
    if: needs.source.outputs.reuse_common != 'true'
    name: Required Generated Applications
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - run: go run ./scripts/release/regression generated
      - run: go run ./scripts/release/regression check generated-regression.jsonl --generated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-regression
          path: generated-regression.jsonl
  live-composition:
    name: Required channel composition (${{ matrix.layout }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        layout: [legacy, layered-v1]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Generate and verify the target channel composition
        env:
          TARGET_CHANNEL: ${{ inputs.channel || github.base_ref || github.ref_name }}
          SPINE_COMPOSITION_CASE: echo
          SPINE_COMPOSITION_LAYOUT: ${{ matrix.layout }}
        run: |
          case "$TARGET_CHANNEL" in
            preview|rc|stable) export SPINE_COMPOSITION_CHANNEL="$TARGET_CHANNEL" ;;
            main) export SPINE_COMPOSITION_CHANNEL=stable ;;
            *) echo "Unknown target channel: $TARGET_CHANNEL" >&2; exit 1 ;;
          esac
          go test ./internal/cli -run '^TestChannelComposition$' -v -count=1 -timeout=20m
  verified:
    name: ${{ github.event_name == 'pull_request' && format('Verified Source / {0}', github.base_ref) || 'Verified Source' }}
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [source, policy, portable, core-regression, generated-regression, live-composition]
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - id: source
        env:
          RESULTS: ${{ toJSON(needs) }}
          REUSE_COMMON: ${{ needs.source.outputs.reuse_common }}
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: go run ./scripts/release/publication verified-source
