name: Release Pipeline
on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        default: ''
      source:
        type: string
        required: true
      observation_override_reason:
        type: string
        default: ''
    secrets:
      DISCORD_WEBHOOK_PREVIEW:
        required: false
      DISCORD_WEBHOOK_RC:
        required: false
      DISCORD_WEBHOOK_RELEASE:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Validate release policy and source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_OVERRIDE_REASON: ${{ inputs.observation_override_reason }}
        run: python3 scripts/release/release.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: |
            release-plan.json
            release-title.txt
            release-notes.md
          if-no-files-found: error
  ci:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
  public-before-tag:
    needs: plan
    uses: ./.github/workflows/release-public-check.yml
    with:
      source_sha: ${{ needs.plan.outputs.sha }}
      query: ${{ needs.plan.outputs.sha }}
      artifact: public-before-tag
  tag:
    needs: [plan, ci, public-before-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    environment: ${{ format('release-{0}', inputs.channel) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: public-before-tag-*
          path: public-reports
      - name: Create immutable tag after verification and approval
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.ci.outputs.verified_sha }}
        run: python3 scripts/release/release.py tag
      - name: Notify Discord of the new tag
        uses: NARUBROWN/spine/.github/actions/discord-tag@4e53e0b5ba0bed84e3eadc9b49bc31bddcc64f4d
        continue-on-error: true
        timeout-minutes: 1
        with:
          plan: release-plan.json
          webhook_preview: ${{ secrets.DISCORD_WEBHOOK_PREVIEW }}
          webhook_rc: ${{ secrets.DISCORD_WEBHOOK_RC }}
          webhook_release: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
  public-after-tag:
    needs: [plan, tag]
    uses: ./.github/workflows/release-public-check.yml
    with:
      source_sha: ${{ needs.plan.outputs.sha }}
      query: ${{ needs.plan.outputs.version }}
      artifact: public-after-tag
  finish:
    needs: [plan, tag, public-after-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: public-after-tag-*
          path: public-reports
      - name: Record verified tag and publish Production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py finish
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.plan.outputs.version }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
