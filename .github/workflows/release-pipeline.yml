name: Release Pipeline
on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      version:
        type: string
        default: ''
      source:
        type: string
        required: true
      observation_override_reason:
        type: string
        default: ''
    secrets:
      RELEASE_EVIDENCE_TOKEN:
        required: false
      DISCORD_WEBHOOK_PREVIEW:
        required: false
      DISCORD_WEBHOOK_RC:
        required: false
      DISCORD_WEBHOOK_RELEASE:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag_only: ${{ steps.plan.outputs.tag_only }}
      reuse_ci: ${{ steps.plan.outputs.reuse_ci }}
      reuse_common: ${{ steps.plan.outputs.reuse_common }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Validate release policy and source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE: ${{ inputs.source }}
          RELEASE_OVERRIDE_REASON: ${{ inputs.observation_override_reason }}
        run: go run ./scripts/release/publication plan
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: |
            release-plan.json
            release-title.txt
            release-notes.md
          if-no-files-found: error
  ci:
    needs: plan
    if: needs.plan.outputs.reuse_ci == 'false'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      channel: ${{ inputs.channel }}
      reuse_common: ${{ needs.plan.outputs.reuse_common == 'true' }}
  public-before-tag:
    needs: plan
    if: needs.plan.outputs.tag_only == 'false'
    uses: ./.github/workflows/release-public-check.yml
    with:
      source_sha: ${{ needs.plan.outputs.sha }}
      query: ${{ needs.plan.outputs.sha }}
      artifact: public-before-tag
  tag:
    needs: [plan, ci, public-before-tag]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      ((needs.plan.outputs.reuse_ci == 'true' && needs.ci.result == 'skipped') ||
      (needs.plan.outputs.reuse_ci == 'false' && needs.ci.result == 'success')) &&
      ((needs.plan.outputs.tag_only == 'true' && needs.public-before-tag.result == 'skipped') ||
      (needs.plan.outputs.tag_only == 'false' && needs.public-before-tag.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    environment: ${{ format('release-{0}', inputs.channel) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.tag_only == 'false'
        with:
          pattern: public-before-tag-*
          path: public-reports
      - name: Create immutable tag after verification and approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
          VERIFIED_SHA: ${{ needs.plan.outputs.reuse_ci == 'true' && needs.plan.outputs.sha || needs.ci.outputs.verified_sha }}
        run: go run ./scripts/release/publication tag
      - name: Notify Discord of the new tag
        uses: ./.github/actions/discord-tag
        continue-on-error: true
        timeout-minutes: 1
        with:
          plan: release-plan.json
          webhook_preview: ${{ secrets.DISCORD_WEBHOOK_PREVIEW }}
          webhook_rc: ${{ secrets.DISCORD_WEBHOOK_RC }}
          webhook_release: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
  public-after-tag:
    needs: [plan, tag]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.tag.result == 'success' }}
    uses: ./.github/workflows/release-public-check.yml
    with:
      source_sha: ${{ needs.plan.outputs.sha }}
      query: ${{ needs.plan.outputs.version }}
      artifact: public-after-tag
  finish:
    needs: [plan, tag, public-after-tag]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require successful published tag installation
        if: needs.public-after-tag.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: public-after-tag-*
          path: public-reports
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Record verified tag and publish Production release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
        run: go run ./scripts/release/publication finish
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.plan.outputs.version }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
