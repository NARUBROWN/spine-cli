name: Publish Preview
run-name: Preview ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: '새 Preview 버전 (예: v0.4.3-preview.1)'
        type: string
        required: true
      source_sha:
        description: preview 브랜치 HEAD의 전체 40자리 커밋 SHA
        type: string
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: spine-cli-release-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: ./.github/workflows/release-pipeline.yml
    secrets:
      RELEASE_EVIDENCE_TOKEN: ${{ secrets.RELEASE_EVIDENCE_TOKEN }}
      DISCORD_WEBHOOK_PREVIEW: ${{ secrets.DISCORD_WEBHOOK_PREVIEW }}
      DISCORD_WEBHOOK_RC: ${{ secrets.DISCORD_WEBHOOK_RC }}
      DISCORD_WEBHOOK_RELEASE: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
    with:
      channel: preview
      version: ${{ inputs.version }}
      source: ${{ inputs.source_sha }}
