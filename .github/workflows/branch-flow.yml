name: Branch Flow
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  statuses: write
concurrency:
  group: branch-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  routing:
    name: Enforce PR Direction
    runs-on: ubuntu-latest
    steps:
      # PR의 코드를 실행하지 않고 기본 브랜치에 있는 정책만 사용합니다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { configuredHotfixPreviewBranch, evaluate } = require('./scripts/release/branch_flow.cjs');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const sameRepository = pr.head.repo?.full_name === pr.base.repo.full_name;
            let hotfixPreviewBranch;
            if (sameRepository && pr.base.ref === 'rc' && pr.head.ref.endsWith('-hotfix-preview')) {
              // 승격 방향에는 대상 RC 커밋에 이미 공개된 정책을 사용합니다.
              const { data: policy } = await github.rest.repos.getContent({
                ...context.repo, path: '.github/release-policy.json', ref: pr.base.sha,
              });
              if (policy.type === 'file' && policy.encoding === 'base64') {
                hotfixPreviewBranch = configuredHotfixPreviewBranch(
                  JSON.parse(Buffer.from(policy.content, 'base64').toString('utf8')),
                );
              }
            }
            const result = evaluate({
              head: pr.head.ref,
              base: pr.base.ref,
              sameRepository,
              hotfixPreviewBranch,
              bootstrap: context.payload.repository.default_branch === "main",
            });
            const target_url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Actions의 PR check run과 같은 head SHA에 기록합니다.
            // 임시 merge SHA에 상태를 쓰면 GitHub가 그 SHA에서 모든 필수 검사를 찾습니다.
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: pr.head.sha, context: result.context,
              state: result.allowed ? 'success' : 'failure',
              description: result.description.slice(0, 140), target_url,
            });
            if (!result.allowed) {
              core.setFailed(result.description);
            }
