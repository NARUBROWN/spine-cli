name: Publish RC
run-name: RC ${{ inputs.version }} from ${{ inputs.preview_tag }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: '새 RC 버전 (예: v0.4.3-rc.1)'
        type: string
        required: true
      preview_tag:
        description: 태그 공개와 Actions 검증 기록 저장을 마친 같은 버전의 Preview 태그
        type: string
        required: true
      observation_override_reason:
        description: '긴급 관찰 기간 단축 사유 (평소에는 비움, 20자 이상)'
        type: string
        required: false
permissions:
  contents: write
  actions: read
concurrency:
  group: spine-cli-release-publication
  cancel-in-progress: false
jobs:
  publish:
    uses: ./.github/workflows/release-pipeline.yml
    secrets:
      DISCORD_WEBHOOK_PREVIEW: ${{ secrets.DISCORD_WEBHOOK_PREVIEW }}
      DISCORD_WEBHOOK_RC: ${{ secrets.DISCORD_WEBHOOK_RC }}
      DISCORD_WEBHOOK_RELEASE: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
    with:
      channel: rc
      version: ${{ inputs.version }}
      source: ${{ inputs.preview_tag }}
      observation_override_reason: ${{ inputs.observation_override_reason }}
